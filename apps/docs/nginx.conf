# docs.opencms.kdigi.vn static site. TLS and HSTS are the edge's job (Coolify/Traefik), not nginx's.
#
# nginx does NOT inherit `add_header` into a location that defines its own, so every location that sets
# Cache-Control repeats the security headers (via the include below).
server {
  listen 80;
  server_name _;
  server_tokens off;
  # behind Traefik an absolute redirect would carry the internal scheme/port
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/security-headers.inc;

  # Astro emits directory indexes (/huong-dan/bat-dau-nhanh/ -> .../index.html), raw .md files and a 404.html.
  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # raw markdown copies of every page ("Copy markdown" button, llms.txt)
  location ~ \.md$ {
    default_type text/markdown;
    charset utf-8;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location = /version.txt {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location /pagefind/ {
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown application/wasm;
}
